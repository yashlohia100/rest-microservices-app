global:
  scrape_interval: 15s

scrape_configs:
  - job_name: user-app
    static_configs:
      - targets: ['user-app:8000']
  - job_name: post-app
    static_configs:
      - targets: ['post-app:9000']
  - job_name: auth-service
    static_configs:
      - targets: ['auth-app:11000']
  - job_name: event-service
    static_configs:
      - targets:
          - 'event-app:12000'

