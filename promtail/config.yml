server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: auth-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth-service
          __path__: /var/logs/auth-service/*.log
  - job_name: event-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: event-service
          __path__: /var/logs/event-service/*.log
  - job_name: user-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: user-app
          __path__: /var/logs/user-app/*.log
  - job_name: post-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: post-app
          __path__: /var/logs/post-app/*.log
