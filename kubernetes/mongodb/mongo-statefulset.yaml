apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: mongodb
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:8
          ports:
            - containerPort: 27017
              name: mongo
          envFrom:
            - secretRef:
                name: mongo-secret
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              cpu: '250m'
              memory: '256Mi'
            limits:
              memory: '512Mi'
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh --eval "db.adminCommand('ping')" --username $MONGO_INITDB_ROOT_USERNAME --password $MONGO_INITDB_ROOT_PASSWORD --quiet
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh --eval "db.adminCommand('ping')" --username $MONGO_INITDB_ROOT_USERNAME --password $MONGO_INITDB_ROOT_PASSWORD --quiet
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
        - name: mongo-exporter
          image: percona/mongodb_exporter:0.40
          ports:
            - containerPort: 9216
              name: metrics
          # TODO: Replace root credentials with a dedicated low-privilege
          # monitoring user that has only the built-in `clusterMonitor` role.
          # Create it once with:
          #   db.getSiblingDB("admin").createUser({
          #     user: "metrics",
          #     pwd: "<password>",
          #     roles: [{ role: "clusterMonitor", db: "admin" }]
          #   })
          # then store its credentials in a separate `mongo-exporter-secret`.
          envFrom:
            - secretRef:
                name: mongo-secret
          args:
            - '--mongodb.uri=mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@localhost:27017'
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              memory: '256Mi'
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9216
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9216
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
