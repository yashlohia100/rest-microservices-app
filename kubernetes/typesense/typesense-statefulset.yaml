apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: typesense
  namespace: typesense
spec:
  serviceName: typesense
  replicas: 1
  selector:
    matchLabels:
      app: typesense
  template:
    metadata:
      labels:
        app: typesense
    spec:
      containers:
        - name: typesense
          image: typesense/typesense:27.1
          ports:
            - containerPort: 8108
              name: typesense
          volumeMounts:
            - name: typesense-data
              mountPath: /data
          args:
            - '--data-dir=/data'
            - '--api-key=$(TYPESENSE_API_KEY)'
            - '--enable-cors'
          envFrom:
            - secretRef:
                name: typesense-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8108
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8108
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: typesense-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
