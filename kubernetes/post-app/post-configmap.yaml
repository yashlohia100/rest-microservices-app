  LOG_LEVEL: 'debug'
  PORT: '9000'
  AUTH_SERVICE_URL: 'http://localhost:11000'
  USER_SERVICE_URL: 'http://localhost:8000'
  EVENT_SERVICE_URL: 'http://localhost:12000'
  TYPESENSE_HOST: 'localhost'
  TYPESENSE_PORT: '8108'
  REDIS_URL: 'redis://localhost:6379'
