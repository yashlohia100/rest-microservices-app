apiVersion: v1
kind: ConfigMap
metadata:
  name: post-config
  namespace: post-app
data:
  NODE_ENV: 'development'
  LOG_LEVEL: 'debug'
  PORT: '9000'
  AUTH_SERVICE_URL: 'http://auth-app.auth-app:11000'
  USER_SERVICE_URL: 'http://user-app.user-app:8000'
  EVENT_SERVICE_URL: 'http://event-app.event-app:12000'
  TYPESENSE_HOST: 'typesense-0.typesense.typesense'
  TYPESENSE_PORT: '8108'
  REDIS_URL: 'redis://redis-0.redis.redis:6379'
