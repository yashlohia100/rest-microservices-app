apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-app
  namespace: auth-app
spec:
  selector:
    matchLabels:
      app: auth-app
  template:
    metadata:
      labels:
        app: auth-app
    spec:
      imagePullSecrets:
        - name: dockerhub-regcred
      containers:
        - name: auth-app
          image: yashlohia105/rest-msvc-app:auth-app-v1
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 11000
              name: http
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret
