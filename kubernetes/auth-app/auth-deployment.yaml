apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-app
  namespace: auth-app
spec:
  selector:
    matchLabels:
      app: auth-app
  template:
    metadata:
      labels:
        app: auth-app
    spec:
      containers:
        - name: auth-app
          image: auth-app:latest
          resources:
            limits:
              memory: '128Mi'
              cpu: '500m'
          ports:
            - containerPort: 11000
              name: auth-app
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret
