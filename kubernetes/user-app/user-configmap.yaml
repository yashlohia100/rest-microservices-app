apiVersion: v1
kind: ConfigMap
metadata:
  name: user-config
  namespace: user-app
data:
  NODE_ENV: development
  LOG_LEVEL: debug
  PORT: '8000'
  AUTH_SERVICE_URL: 'http://auth-app.auth-app:11000'
  EVENT_SERVICE_URL: 'http://event-app.event-app:12000'
  REDIS_HOST: 'redis-0.redis.redis'
  REDIS_PORT: '6379'
